name: Repair npm lockfile and verify installation
on:
  push:
    branches: [fix/npm-lockfile-node24]
    paths:
      - .github/workflows/repair-lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Regenerate complete lockfile
        run: |
          rm package-lock.json
          npm install --package-lock-only --no-audit --no-fund
      - name: Confirm clean installation
        run: npm ci --no-audit --no-fund
      - name: Commit repaired lockfile
        if: success()
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(ci): regenerate npm lockfile with clean dependency resolution"
          git push origin HEAD:fix/npm-lockfile-node24
