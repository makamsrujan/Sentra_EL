name: Verify SENTRA code
on:
  push:
    branches: [main, "sentra/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    name: React, Express, and Native C Firmware Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Native C pre-hardware firmware unit suite (GCC -Werror)
        run: |
          gcc -Wall -Wextra -Werror -DSENTRA_FIRMWARE_HOST_TEST \
            -Ifirmware/esp32s3/include -Ifirmware/esp32s3/tests \
            firmware/esp32s3/tests/test_firmware.c \
            firmware/esp32s3/src/vl53l0x.c \
            firmware/esp32s3/src/mpu6050.c \
            firmware/esp32s3/src/obstacle_awareness.c \
            firmware/esp32s3/src/local_alerts.c \
            firmware/esp32s3/src/device_telemetry.c \
            -lm -o /tmp/sentra_fw_test && /tmp/sentra_fw_test
      - name: Simulator-labeled HTTP API smoke
        env:
          SENTRA_OPERATOR_TOKEN: ci-local-test-token
          SENTRA_SIMULATOR_ENABLED: "true"
          SENTRA_BASE_URL: http://127.0.0.1:3761
          PORT: "3761"
        run: |
          npm run dev > /tmp/sentra-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:3761/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/sentra-server.log; exit 1; fi
          node simulator/esp32_sim.mjs

  esp32s3:
    name: ESP32-S3 ESP-IDF v5.3 firmware build (not a hardware test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP-IDF v5.3 firmware (esp32s3 target)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.3
          target: esp32s3
          path: firmware/esp32s3
