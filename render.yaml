services:
  - type: web
    name: sentra-el
    runtime: node
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: SENTRA_GEMINI_MODEL
        value: gemini-3.8-flash
      - key: SENTRA_LIVE_MODEL
        value: gemini-3.8-live
      - key: SENTRA_LIVE_VOICE
        value: Zephyr
      - key: GEMINI_STT_MODEL
        value: gemini-3.5-transcribe
      - key: GEMINI_TTS_MODEL
        value: gemini-3.8-flash-lite-tts
      - key: SENTRA_TTS_VOICE
        value: Puck
      - key: SENTRA_OPERATOR_TOKEN
        generateValue: true
      - key: SENTRA_DEVICE_TOKEN
        generateValue: true
      - key: SENTRA_SIMULATOR_ENABLED
        value: "true"
      - key: SENTRA_HEARTBEAT_TIMEOUT_MS
        value: "15000"
      - key: SENTRA_DB_PATH
        value: /tmp/sentra.db
