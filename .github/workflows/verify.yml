name: Verify SENTRA code
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    name: React and Express
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile for compatible Vite/esbuild pair
        run: |
          npm install --package-lock-only --ignore-scripts
          node -e "const fs=require('fs'); const s=fs.readFileSync('package-lock.json','utf8'); for(let i=0;i<s.length;i+=3000) console.log('SENTRA_LOCK_CHUNK:'+s.slice(i,i+3000).replace(/\\n/g,' '))"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  esp32s3:
    name: ESP32-S3 firmware build (not a hardware test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP-IDF firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.3
          target: esp32s3
          path: firmware/esp32s3
